---
# common parameters
n_cores: &cores 4

# This is an ordered dict that contains the order in which the steps are run.
run_sequence: !!omap
  - 1: 'basic_check'
  - 2: 'infer_build'
  - 3: 'fill_data'
  - 4: 'harmonize'
  - 5: 'sort_alphabetically'
  - 6: 'write_tsv'
  - 7: 'write_snp_mapping'


steps:
  basic_check: # see https://cloufield.github.io/gwaslab/Standardization/
    params:
      run: True
    gl_params:
      n_cores: *cores
      normalize: True
      fixid_args:
        fixid: True
        overwrite: True
  infer_build: # see https://cloufield.github.io/gwaslab/InferBuild/
    params:
      run: True
  fill_data: # see https://cloufield.github.io/gwaslab/Conversion/#fill_data
    params:
      run: True
    gl_params:
      to_fill: ['MLOG10P', 'Z', 'CHISQ', 'EAF']
      overwrite: False
      extreme: True
  harmonize: # see https://cloufield.github.io/gwaslab/Harmonization/
    params:
      run: True
    gl_params:
      basic_check: False
      n_cores: *cores
  sort_alphabetically:
    params:
      run: True
    gl_params:
      n_cores: *cores
  write_tsv:
    params:
      run: True
      workspace: "outputs"
      workspace_subfolder: True
    gl_params:
      fmt: "gwaslab"
      xymt_number: True
      to_csvargs:
        compression:
          method: "gzip"
          compresslevel: 1
          mtime: 1
  write_snp_mapping: # see https://cloufield.github.io/gwaslab/Standardization/
    params:
      run: True
      workspace: "snp_mapping"
      workspace_subfolder: False
    gl_params:
      fmt: "snp_mapping"


# Filename transformation, e.g.: impute_dedup_recoded_22_.gwaslab.tsv.gz
filename_mask: [ False, False, False, True, False]
filename_sep: '_'

# IO
root_path: "results"
log_filename: "gwaspipe.log"
formatbook_path: "config/gwaspipe/formatbook.json"     # fill this var if you want to provide a custom formatbook
